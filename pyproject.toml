[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kilk"
version = "0.1.0"
description = "Read-only MCP server exposing the Subby project's docs, features, roadmap, and glossary."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Subby" }]
keywords = ["mcp", "model-context-protocol", "subby", "hospitality"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.6.0",
]

[project.scripts]
kilk = "kilk.server:main"

[project.urls]
Homepage = "https://github.com/corporate-keyboard/kilk"
Issues = "https://github.com/corporate-keyboard/kilk/issues"

[tool.hatch.build.targets.wheel]
packages = ["kilk"]

[tool.hatch.build.targets.wheel.force-include]
"project_info" = "kilk/project_info"
