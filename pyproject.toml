[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "subby-info-mcp"
version = "0.1.0"
description = "Read-only MCP server exposing the Subby project's docs, features, roadmap, and glossary."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Subby" }]
keywords = ["mcp", "model-context-protocol", "subby", "hospitality"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.6.0",
]

[project.scripts]
subby-info-mcp = "subby_info_mcp.server:main"

[project.urls]
Homepage = "https://github.com/your-org/subby-info-mcp"
Issues = "https://github.com/your-org/subby-info-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["subby_info_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"project_info" = "subby_info_mcp/project_info"
